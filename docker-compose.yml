# Base stack. Phase 0 = shared infrastructure only (postgres, redis, minio).
# Application services are added in later phases.
#
#   dev  : docker compose up            (docker-compose.override.yml auto-applies)
#   prod : docker compose -f docker-compose.yml up

name: jobilee

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobilee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobilee}
      POSTGRES_DB: ${POSTGRES_DB:-jobilee}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory: creates auth/jobs/resume/ai.
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    # Bound to loopback: these credentials are dev throwaways, and publishing on
    # 0.0.0.0 would expose the object store to everyone on your network.
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: creates the resumes bucket, then exits. Idempotent.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-resumes}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "minio-init: bucket '$$S3_BUCKET' ready"

  # ---- application services -------------------------------------------------

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      # Only auth is routed in Phase 1; the rest are added with their services.
      JOBS_SERVICE_URL: ""
      RESUME_SERVICE_URL: ""
      AI_SERVICE_URL: ""
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080/api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
