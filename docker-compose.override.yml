# Dev-only overrides. Applied automatically by `docker compose up`.
# Phase 0: publish infra ports to the host so you can reach them from local
# tooling (psql, redis-cli, prisma migrate run outside a container).
# Later phases add source mounts + watch-mode commands for the services here.

#
# Ports are bound to 127.0.0.1 on purpose. A bare "5432:5432" listens on every
# interface, which would put a postgres with dev-default credentials on whatever
# network you happen to be on. Keep the loopback prefix.

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
